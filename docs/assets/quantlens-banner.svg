<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">QuantLens: keep the event and your reasoning together</title>
  <desc id="desc">A concept event screen links an original source with a personal research note. This is a design illustration, not a running app.</desc>
  <rect width="1200" height="360" rx="22" fill="#17342F"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="49" font-size="14" font-weight="700" letter-spacing="2" fill="#B9D9CB">A RESEARCH TRAIL YOU CAN RETURN TO</text>
    <text x="48" y="125" font-size="52" font-weight="700" fill="#FFF9EF">Keep the event.</text>
    <text x="48" y="188" font-size="52" font-weight="700" fill="#FFF9EF">Keep your reasoning.</text>
    <text x="48" y="231" font-size="19" fill="#DCF0E8">Read the announcement. Check its source. Add your own view.</text>
    <circle cx="64" cy="297" r="16" fill="#F07F66"/>
    <text x="64" y="303" font-size="16" font-weight="700" text-anchor="middle" fill="#17342F">1</text>
    <text x="94" y="305" font-size="22" font-weight="700" fill="#FFF9EF">Event</text>
    <line x1="179" y1="297" x2="235" y2="297" stroke="#5E8C7C" stroke-width="2"/>
    <circle cx="268" cy="297" r="16" fill="#F3D7AA"/>
    <text x="268" y="303" font-size="16" font-weight="700" text-anchor="middle" fill="#17342F">2</text>
    <text x="298" y="305" font-size="22" font-weight="700" fill="#FFF9EF">Source</text>
    <line x1="398" y1="297" x2="454" y2="297" stroke="#5E8C7C" stroke-width="2"/>
    <circle cx="487" cy="297" r="16" fill="#DCF0E8"/>
    <text x="487" y="303" font-size="16" font-weight="700" text-anchor="middle" fill="#17342F">3</text>
    <text x="517" y="305" font-size="22" font-weight="700" fill="#FFF9EF">Your note</text>
    <rect x="865" y="22" width="287" height="315" rx="24" fill="#FFF9EF"/>
    <rect x="970" y="33" width="78" height="4" rx="2" fill="#17342F"/>
    <text x="888" y="69" font-size="17" font-weight="700" fill="#17342F">Event details</text>
    <text x="888" y="100" font-size="11" letter-spacing="1.3" fill="#5E746D">CONCEPT INTERFACE</text>
    <text x="888" y="136" font-size="20" font-weight="700" fill="#17342F">Earnings announcement</text>
    <text x="888" y="162" font-size="13" fill="#5E746D">Example event · Source and time</text>
    <rect x="886" y="180" width="245" height="37" rx="9" fill="#1D7666"/>
    <text x="1008" y="204" font-size="15" text-anchor="middle" fill="#FFFFFF">Open original source</text>
    <rect x="886" y="232" width="245" height="84" rx="10" fill="#DCF0E8"/>
    <text x="901" y="258" font-size="16" font-weight="700" fill="#17342F">Your linked research note</text>
    <text x="901" y="284" font-size="13" fill="#365449">Questions. Evidence. Follow-up.</text>
    <text x="901" y="304" font-size="12" fill="#1D7666">Keep it with the event.</text>
  </g>
</svg>
